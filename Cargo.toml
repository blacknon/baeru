[package]
name = "baeru"
version = "0.1.0"
edition = "2021"
description = "Cinematic reveal, ANSI themes, and keymaps for existing terminal apps"
license = "MIT"
repository = "https://github.com/blacknon/baeru"
homepage = "https://github.com/blacknon/baeru"
readme = "README.md"
keywords = ["terminal", "tui", "ansi", "cli", "animation"]
categories = ["command-line-utilities"]
include = [
  "src/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "themes/**",
  "examples/minimal.yml",
  "examples/keymaps/**",
  "examples/themes/**",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
vt100 = "0.16"
