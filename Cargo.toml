[package]
name = "baeru"
version = "0.0.1"
edition = "2021"
description = "Cinematic reveal, ANSI themes, and keymaps for existing terminal apps"
license = "MIT"
repository = "https://github.com/blacknon/baeru"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
vt100 = "0.16"
