profiles:
  - name: htop-jirai-vim
    match:
      command: htop
    backend: tui
    features:
      - reveal
      - live_color
      - keymap
      - live_render
    # effect: matrix
    # effect: coalesce
    effect: scatter
    animation_color_fade: true
    animation_color_darken_factor: 0.02
    live_render_duration_ms: 120
    live_render_mouse_quiet_ms: 280
    keymap_file: examples/keymaps/htop-vim.yml
    theme_file: examples/themes/jirai-pink.yml
    capture_ms: 360
    duration_ms: 1120
    frames: 24

  - name: lazygit-matrix
    match:
      command: lazygit
    backend: tui
    features:
      - reveal
      - live_color
      - keymap
    effect: coalesce
    keymap:
      ctrl-j: down
      ctrl-k: up
      ctrl-h: left
      ctrl-l: right

  - name: git-status-inline
    match:
      command: git
      args_prefix: ["status"]
    backend: cli
    features:
      - inline_animation
    effect: sweep
    theme_file: examples/themes/jirai-pink.yml
    cli_settled_color: "#ffcdeb"
    cli_gradient_start: "#84205c"
    cli_gradient_end: "#fff2fa"
    duration_ms: 720
    frames: 18
    max_lines: 24
    max_bytes: 120000

  - name: ls-inline
    match:
      command: ls
    backend: cli
    features:
      - inline_animation
    effect: coalesce
    # theme_file: themes/matrix-green.yml
    # cli_settled_color: "#b6ffd0"
    # cli_gradient_start: "#004d26"
    # cli_gradient_end: "#eafff2"
    animation_color_fade: true
    animation_color_darken_factor: 0.02
    duration_ms: 900
    frames: 20
    # max_lines: 16
    # max_bytes: 80000

  - name: df-inline
    match:
      command: df
    backend: cli
    features:
      - inline_animation
    effect: sweep
    theme_file: themes/matrix-green.yml
    cli_settled_color: "#b6ffd0"
    cli_animation_color: "#33ff99"
    duration_ms: 700
    frames: 18
    # max_lines: 20
    # max_bytes: 100000

  - name: ps-inline
    match:
      command: ps
    backend: cli
    features:
      - inline_animation
    effect: plain

  - name: cargo-test-inline
    match:
      command: cargo
      args_prefix: ["test"]
    backend: cli
    features:
      - inline_animation
    effect: sweep
    theme_file: examples/themes/jirai-pink.yml
    duration_ms: 900
    frames: 18
    max_lines: 20
    max_bytes: 120000
    highlight_rules:
      - key: test-failure
        pattern: "(?i)error|failed|panic"
        color: "#ffff00"
        capture_cli_text: true

  - name: neofetch
    match:
      command: neofetch
    backend: cli
    features:
      - inline_animation
    # effect: matrix
    # theme_file: examples/themes/jirai-pink.yml
    animation_color_fade: true
    animation_color_darken_factor: 0.02
    live_render_duration_ms: 120
    live_render_mouse_quiet_ms: 280
    duration_ms: 900
    frames: 18

  - name: htop-live-render-experimental
    match:
      command: htop-live
    backend: tui
    features:
      - live_render
      - keymap
    effect: coalesce
    # keymap_file: examples/keymaps/htop-vim.yml
    live_render_duration_ms: 90
    live_render_mouse_quiet_ms: 180
    animation_color_fade: true
    animation_color_darken_factor: 0.22
    highlight_rules:
      - key: high-load
        pattern: "(?i)load average|running"
        color: "#ffff00"
        capture_tui_screenshot: true
