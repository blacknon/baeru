name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish in dry-run mode"
        required: true
        default: true
        type: boolean
      git_ref:
        description: "Optional git ref to publish from"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify publish candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --quiet

      - name: Verify publishable package
        run: cargo package --locked

  publish-crate:
    name: Publish baeru
    needs: verify
    runs-on: ubuntu-24.04
    environment: crates-io
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Publish crate (dry-run)
        if: inputs.dry_run
        run: cargo publish --locked --dry-run

      - name: Publish crate
        if: ${{ !inputs.dry_run }}
        run: cargo publish --locked
