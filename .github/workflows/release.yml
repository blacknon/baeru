name: Release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Optional git ref to build the release from"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --quiet

      - name: Verify publishable package
        run: cargo package --locked

  release-assets:
    name: Release Asset Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            artifact_name: build-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            artifact_name: build-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            artifact_name: build-x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Get version
        id: package_version
        shell: bash
        run: |
          VERSION="$(awk -F '\"' '/^version = / { print $2; exit }' Cargo.toml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ steps.package_version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="baeru-${VERSION}.${TARGET}.tar.gz"
          PKGDIR="dist/package"

          rm -rf dist
          mkdir -p "$PKGDIR/examples" "$PKGDIR/keymaps" "$PKGDIR/themes"

          cp "target/${TARGET}/release/baeru" "$PKGDIR/"
          cp README.md LICENSE "$PKGDIR/"
          cp examples/minimal.yml "$PKGDIR/examples/baeru.yml"
          cp -R examples/themes/. "$PKGDIR/examples/themes/"
          cp -R keymaps/. "$PKGDIR/keymaps/"
          cp -R themes/. "$PKGDIR/themes/"

          tar -C "$PKGDIR" -czf "dist/${ARCHIVE}" .

      - name: Package zip
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $Version = "${{ steps.package_version.outputs.version }}"
          $Target = "${{ matrix.target }}"
          $Archive = "baeru-$Version.$Target.zip"
          $PkgDir = "dist/package"

          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$PkgDir/examples/themes" | Out-Null
          New-Item -ItemType Directory -Force -Path "$PkgDir/keymaps" | Out-Null
          New-Item -ItemType Directory -Force -Path "$PkgDir/themes" | Out-Null

          Copy-Item "target/$Target/release/baeru.exe" "$PkgDir/"
          Copy-Item README.md, LICENSE "$PkgDir/"
          Copy-Item examples/minimal.yml "$PkgDir/examples/baeru.yml"
          Copy-Item examples/themes/* "$PkgDir/examples/themes/" -Recurse
          Copy-Item keymaps/* "$PkgDir/keymaps/" -Recurse
          Copy-Item themes/* "$PkgDir/themes/" -Recurse

          Compress-Archive -Path "$PkgDir/*" -DestinationPath "dist/$Archive" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/baeru-${{ steps.package_version.outputs.version }}.${{ matrix.target }}.${{ matrix.archive_ext }}

  create-release:
    name: Create Draft Release
    needs: release-assets
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Get version
        id: package_version
        shell: bash
        run: |
          VERSION="$(awk -F '\"' '/^version = / { print $2; exit }' Cargo.toml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${{ steps.package_version.outputs.version }}"
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$VERSION" --repo "$GH_REPO" --title "baeru v$VERSION" --draft
          else
            gh release create "$VERSION" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "baeru v$VERSION" --draft --notes ""
          fi

  upload-release-assets:
    name: Upload Release Asset (${{ matrix.target }})
    needs: [create-release, release-assets]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            artifact_name: build-x86_64-unknown-linux-gnu
          - target: aarch64-apple-darwin
            archive_ext: tar.gz
            artifact_name: build-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            archive_ext: zip
            artifact_name: build-x86_64-pc-windows-msvc
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${{ needs.create-release.outputs.version }}" \
            --repo "$GH_REPO" \
            "release-assets/baeru-${{ needs.create-release.outputs.version }}.${{ matrix.target }}.${{ matrix.archive_ext }}" \
            --clobber
